# ルール名は textlint が報告する ID と完全に一致させる。1文字でも違うと
# 一致せず、無効化したつもりのルールが有効なまま残る。括弧の全角/半角も
# ID のとおりに書く（`npx textlint --print-config` で確認できる）。
rules:
  preset-jtf-style:
    # 全角と半角の間に空白を要求する流儀。本リポジトリは従っていない。
    # 導入時点で318件と、実質的な全面書き換えになる規模だった。
    "3.1.1.全角文字と半角文字の間": false
    # 鉤括弧の中のインラインコード前後の空白を誤検出する。Bad/Good の例示で
    # 常用する書き方のため実用に耐えない。
    "3.3.かっこ類と隣接する文字の間のスペースの有無": false
    # 全角コロンを要求する。「対象:」「差分での見つけ方:」などを全面書き換え
    # することになる。導入時点で50件。
    "4.2.7.コロン(：)": false
    # 検査を scripts/validate_text.py へ移管したため無効。このルールは見出し・
    # テーブル・引用を対象から外して19箇所を取りこぼし、さらに自動修正が開き
    # 括弧だけを全角へ変えて閉じ括弧を半角のまま残す不整合を生成したうえ、
    # その結果を再検査しても検出しない。
    "4.3.1.丸かっこ（）": false
